<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bản Đồ Đại Lý</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#065f46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body class="bg-slate-100 text-slate-800 h-full flex flex-col antialiased">
<div id="app-root" style="padding:2rem;text-align:center;color:#64748b">Đang tải Bản Đồ Đại Lý...</div>
<script>
fetch('https://raw.githubusercontent.com/khoahuynh020997/bandodaily/58c636317732c8f4a45eda86f892d9113d1c2898/index.html')
  .then(function(r) { return r.text(); })
  .then(function(html) {
    html = html
      .replace(/js\/app\.js\?v=\d+/g, 'js/app.js?v=7')
      .replace(/sw\.js\?v=\d+/g, 'sw.js?v=7')
      .replace(/css\/styles\.css\?v=\d+/g, 'css/styles.css?v=7');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function() {
    document.getElementById('app-root').innerHTML = '<p>Không tải được giao diện. <a href="javascript:location.reload()">Tải lại</a></p>';
  });
</script>
</body>
</html>
